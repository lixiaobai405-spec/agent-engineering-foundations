[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-engineering-foundations"
version = "0.1.0"
description = "A learning-first, read-only Python agent runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "openai>=2.46,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
agent-foundations = "agent_foundations.cli.main:app"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "pytest-playwright>=0.6,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundations"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "docker: explicitly authorized tests that build or run the Task 14 sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_foundations"]
